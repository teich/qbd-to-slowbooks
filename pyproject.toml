[project]
name = "qbd-to-slowbooks"
version = "0.1.0"
description = "Load QuickBooks Desktop data captured by qbd-exporter into SlowBooks Pro through its API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
qbd-to-slowbooks = "qbd_to_slowbooks.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
